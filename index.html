<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Joseph Mombo — Procurement Officer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#CC1111;--red-dark:#A50D0D;--red-light:#E63030;
  --charcoal:#2B3245;--charcoal-dark:#1A2035;--charcoal-mid:#3D4A63;
  --slate:#8893A8;--white:#FFFFFF;--off-white:#F7F8FA;
  --border:rgba(43,50,69,0.12);
  --sidebar-w:260px;
}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--off-white);color:var(--charcoal);line-height:1.6;display:flex;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{
  position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;
  background:var(--charcoal-dark);border-right:2px solid var(--red);
  display:flex;flex-direction:column;z-index:200;overflow-y:auto;
}
.sidebar-profile{padding:2rem 1.5rem 1.5rem;text-align:center;border-bottom:1px solid rgba(255,255,255,0.07);}
.sidebar-photo{
  width:110px;height:110px;border-radius:50%;
  object-fit:cover;object-position:top center;
  border:3px solid var(--red);margin:0 auto 1rem;display:block;
}
.sidebar-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:800;color:var(--white);line-height:1.2;margin-bottom:0.3rem;}
.sidebar-title{font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--red-light);}
.sidebar-nav{padding:1.25rem 0;flex:1;}
.nav-section{padding:0.5rem 1.5rem 0.25rem;font-size:0.62rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.3);}
.nav-item{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1.5rem;color:rgba(255,255,255,0.65);text-decoration:none;font-size:0.88rem;font-weight:500;transition:all 0.2s;border-left:3px solid transparent;cursor:pointer;}
.nav-item:hover,.nav-item.active{color:var(--white);background:rgba(255,255,255,0.06);border-left-color:var(--red);}
.nav-icon{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.sidebar-contact{padding:1.25rem 1.5rem;border-top:1px solid rgba(255,255,255,0.07);}
.sidebar-contact-title{font-size:0.62rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:0.75rem;}
.contact-mini{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.6rem;}
.contact-mini svg{width:14px;height:14px;stroke:var(--red-light);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.contact-mini span{font-size:0.78rem;color:rgba(255,255,255,0.65);}
.contact-mini a{color:rgba(255,255,255,0.65);text-decoration:none;}
.contact-mini a:hover{color:var(--red-light);}
.hamburger{display:none;position:fixed;top:1rem;left:1rem;z-index:300;background:var(--charcoal-dark);border:2px solid var(--red);border-radius:6px;width:42px;height:42px;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:5px;padding:10px;}
.hamburger span{display:block;width:20px;height:2px;background:var(--white);transition:all 0.3s;}

/* ── MAIN ── */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;}

/* ── PAGES ── */
.page{display:none;animation:fadeIn 0.3s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* ── HERO (HOME) ── */
.hero{
  min-height:100vh;background:var(--charcoal-dark);
  display:flex;align-items:center;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:0;right:0;width:50%;height:100%;
  background:var(--red);clip-path:ellipse(90% 80% at 100% 50%);opacity:0.12;
}
.hero-inner{max-width:900px;margin:0 auto;padding:4rem 3rem;display:grid;grid-template-columns:1.1fr 0.9fr;gap:4rem;align-items:center;position:relative;z-index:1;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:0.72rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--red-light);margin-bottom:1.25rem;}
.hero-eyebrow::before{content:'';display:block;width:28px;height:2px;background:var(--red);}
h1{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,4vw,3.4rem);font-weight:800;color:var(--white);line-height:1.1;margin-bottom:1rem;}
h1 em{color:var(--red-light);font-style:normal;}
.hero-sub{color:rgba(255,255,255,0.6);font-size:0.98rem;max-width:440px;margin-bottom:2rem;line-height:1.75;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:0.7rem 1.6rem;border-radius:4px;font-weight:600;font-size:0.88rem;text-decoration:none;transition:all 0.2s;cursor:pointer;border:2px solid transparent;}
.btn-primary{background:var(--red);color:var(--white);}
.btn-primary:hover{background:var(--red-dark);transform:translateY(-2px);}
.btn-outline{background:transparent;color:var(--white);border-color:rgba(255,255,255,0.3);}
.btn-outline:hover{border-color:var(--white);transform:translateY(-2px);}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;}
.hero-photo-wrap{position:relative;}
.hero-photo-wrap::before{content:'';position:absolute;bottom:-10px;right:-10px;width:100%;height:100%;border:2px solid var(--red);border-radius:12px;z-index:0;opacity:0.5;}
.hero-photo{width:100%;max-width:300px;border-radius:12px;object-fit:cover;object-position:top center;display:block;position:relative;z-index:1;aspect-ratio:3/4;}

/* ── SECTION COMMON ── */
section.page{padding:3rem;}
.section-inner{max-width:900px;margin:0 auto;}
.section-label{display:inline-flex;align-items:center;gap:10px;font-size:0.68rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--red);margin-bottom:0.6rem;}
.section-label::after{content:'';display:block;width:36px;height:2px;background:var(--red);}
h2{font-family:'Playfair Display',serif;font-size:clamp(1.7rem,3vw,2.4rem);font-weight:800;color:var(--charcoal);line-height:1.15;margin-bottom:0.8rem;}
.section-lead{font-size:0.98rem;color:var(--slate);max-width:560px;line-height:1.75;margin-bottom:2.5rem;}
.page-header{background:var(--charcoal);padding:2.5rem 3rem 2rem;border-bottom:3px solid var(--red);margin-bottom:2.5rem;}
.page-header h2{color:var(--white);margin-bottom:0.4rem;}
.page-header .section-label::after{background:var(--red-light);}
.page-header .section-label{color:var(--red-light);}
.page-header p{color:rgba(255,255,255,0.55);font-size:0.9rem;}

/* ── ABOUT ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start;}
.about-photo-wrap{position:relative;}
.about-photo{width:100%;border-radius:12px;object-fit:cover;object-position:top;aspect-ratio:3/4;max-height:480px;}
.about-badge{background:var(--charcoal);color:var(--white);border-radius:10px;padding:1.5rem;border-left:4px solid var(--red);margin-top:-60px;position:relative;z-index:2;margin-left:1rem;margin-right:-0.5rem;}
.about-badge-title{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:800;margin-bottom:0.25rem;}
.about-badge-sub{color:var(--slate);font-size:0.82rem;margin-bottom:1rem;}
.tag-row{display:flex;flex-wrap:wrap;gap:0.4rem;}
.tag{background:rgba(204,17,17,0.15);color:var(--red-light);padding:0.25rem 0.65rem;border-radius:4px;font-size:0.72rem;font-weight:600;}
.about-text p{color:#4A5568;line-height:1.85;margin-bottom:1rem;font-size:0.94rem;}

/* ── STATS ── */
.stats-band{background:var(--charcoal);border-radius:12px;padding:2rem;margin:2.5rem 0;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,0.08);border-radius:8px;overflow:hidden;}
.stat-item{background:var(--charcoal-mid);padding:1.75rem;text-align:center;}
.stat-number{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:700;color:var(--red-light);line-height:1;margin-bottom:0.35rem;}
.stat-label{font-size:0.72rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;}

/* ── SKILLS ── */
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;}
.skill-card{background:var(--white);border-radius:10px;padding:1.5rem;border-top:3px solid var(--red);transition:transform 0.2s,box-shadow 0.2s;}
.skill-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(43,50,69,0.1);}
.skill-card-icon{width:44px;height:44px;border-radius:8px;background:var(--charcoal);margin-bottom:1rem;display:flex;align-items:center;justify-content:center;}
.skill-card-icon svg{width:20px;height:20px;stroke:var(--red-light);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.skill-card h3{font-size:0.95rem;font-weight:700;color:var(--charcoal);margin-bottom:0.4rem;}
.skill-card p{font-size:0.82rem;color:var(--slate);line-height:1.6;}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:2rem;}
.timeline::before{content:'';position:absolute;left:0;top:4px;bottom:0;width:2px;background:linear-gradient(to bottom,var(--red),var(--border));}
.timeline-item{padding-left:2rem;margin-bottom:2.25rem;position:relative;}
.timeline-dot{position:absolute;left:-7px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--red);border:3px solid var(--off-white);}
.timeline-meta{font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--red);margin-bottom:0.2rem;}
.timeline-role{font-size:1.05rem;font-weight:700;color:var(--charcoal);margin-bottom:0.12rem;}
.timeline-org{font-size:0.85rem;color:var(--slate);margin-bottom:0.65rem;}
.timeline-desc{font-size:0.86rem;color:#4A5568;line-height:1.75;}
.timeline-desc ul{padding-left:1rem;}
.timeline-desc li{margin-bottom:0.25rem;}

/* ── EDUCATION ── */
.edu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem;}
.edu-card{background:var(--white);border-radius:10px;padding:1.5rem;border:1px solid var(--border);display:flex;gap:1rem;}
.edu-year{writing-mode:vertical-rl;transform:rotate(180deg);font-size:0.65rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--red);border-right:2px solid var(--red);padding-right:0.65rem;align-self:flex-start;white-space:nowrap;}
.edu-content h3{font-size:0.92rem;font-weight:700;color:var(--charcoal);margin-bottom:0.15rem;}
.edu-content .edu-inst{font-size:0.8rem;font-weight:600;color:var(--slate);margin-bottom:0.4rem;}
.edu-content p{font-size:0.78rem;color:#718096;}

/* ── CONTACT ── */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;}
.contact-card{background:var(--white);border-radius:10px;padding:1.75rem;border:1px solid var(--border);}
.contact-row{display:flex;align-items:center;gap:0.9rem;padding:0.8rem 0;border-bottom:1px solid var(--border);}
.contact-row:last-child{border-bottom:none;}
.contact-icon{width:36px;height:36px;border-radius:7px;background:var(--charcoal);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.contact-icon svg{width:16px;height:16px;stroke:var(--red-light);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.contact-label{font-size:0.68rem;color:var(--slate);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;}
.contact-value{color:var(--charcoal);font-size:0.88rem;font-weight:500;}
.contact-value a{color:var(--charcoal);text-decoration:none;}
.contact-value a:hover{color:var(--red);}
.map-placeholder{background:var(--charcoal);border-radius:10px;padding:2rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:200px;}
.map-placeholder svg{width:48px;height:48px;stroke:var(--red-light);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:1rem;}
.map-placeholder h3{color:var(--white);font-size:1.1rem;margin-bottom:0.3rem;}
.map-placeholder p{color:rgba(255,255,255,0.55);font-size:0.85rem;}
.cta-banner{background:var(--charcoal);border-radius:12px;padding:2.5rem;text-align:center;margin-top:2rem;border:1px solid rgba(204,17,17,0.3);}
.cta-banner h3{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--white);margin-bottom:0.5rem;}
.cta-banner p{color:rgba(255,255,255,0.55);margin-bottom:1.5rem;font-size:0.92rem;}
.cta-banner .btn-primary{margin-right:0.75rem;}

/* ── FADE UP ── */
@media(prefers-reduced-motion:no-preference){
.fade-up{opacity:0;transform:translateY(20px);transition:opacity 0.5s ease,transform 0.5s ease;}
.fade-up.visible{opacity:1;transform:translateY(0);}
}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .hero-inner,.about-grid,.contact-grid{grid-template-columns:1fr;gap:2rem;}
  .skills-grid{grid-template-columns:repeat(2,1fr);}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .edu-grid{grid-template-columns:1fr;}
  .hero-photo-wrap{order:-1;text-align:center;}
  .hero-photo{max-width:240px;margin:0 auto;}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform 0.3s ease;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  section.page{padding:1.5rem;}
  .page-header{padding:1.5rem;}
}
@media(max-width:560px){
  .skills-grid{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<!-- HAMBURGER -->
<div class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menu">
  <span></span><span></span><span></span>
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-profile">
